<div class="flex-1 space-y-10">
    <div
        class="bg-white dark:bg-darkcard rounded-lg border border-slate-100 dark:border-slate-800 shadow-sm overflow-hidden h-full flex flex-col">
        <div id="inventory-header"
            class="inventory-header p-8 border-b border-slate-50 dark:border-slate-800 flex justify-between items-center bg-slate-50/20 dark:bg-transparent">
            <div class="flex items-center gap-3 text-brand-500"><i data-lucide="box" class="w-7 h-7"></i>
                <h2 class="font-black text-[13px] uppercase tracking-widest text-slate-500">Operaciones de costo (<span
                        id="contador-productos">0</span>)</h2>
            </div>
            <button onclick="addRow('productos')"
                class="bg-brand-600 hover:bg-brand-700 text-white px-7 py-2.5 rounded-lg text-[10px] font-black uppercase tracking-widest shadow-lg transition-all">+
                Añadir</button>
        </div>
        <div class="p-6 flex-1 min-h-0">
            <div id="table-container" class="overflow-x-auto hidden">
                <table class="w-full text-left">
                    <thead class="text-[10px] font-black uppercase text-slate-300 dark:text-slate-600 tracking-widest">
                        <tr>
                            <th class="p-4 pl-8 w-2/5">Producto o Servicio</th>
                            <th class="p-4 text-center w-[30%]">Moneda / Monto</th>
                            <th class="p-4 text-center w-[15%]">Sugerido</th>
                            <th class="p-4 text-right uppercase w-[15%]">Subtotal</th>
                            <th class="p-4 text-center w-12"></th>
                        </tr>
                    </thead>
                    <tbody id="tbody-productos"
                        class="divide-y divide-slate-50 dark:divide-slate-800/50 font-bold text-slate-700 dark:text-slate-300">
                    </tbody>
                </table>
            </div>
            <div id="empty-state" class="flex flex-col items-center justify-center py-24 opacity-30 text-center">
                <i data-lucide="package-search" class="w-20 h-20 text-brand-500 mb-6"></i>
                <h3 class="text-slate-800 dark:text-slate-200 font-extrabold uppercase text-[14px] tracking-widest">Sin
                    registros</h3>
            </div>
        </div>
    </div>
</div>
