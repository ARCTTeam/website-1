<!-- BARRA DE NAVEGACIÓN PRINCIPAL -->
<div class="no-print">
    <nav class="p-4 md:p-6 sticky top-0 z-50">
        <div
            class="max-w-7xl mx-auto bg-white/80 dark:bg-slate-900/80 backdrop-blur-md rounded-lg p-2 px-8 shadow-sm flex flex-col lg:flex-row justify-between items-center gap-4 border border-white/20 dark:border-slate-800">

            <!-- Logo y título -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-brand-600 rounded-full flex items-center justify-center text-white shadow-lg">
                    <i data-lucide="zap" class="w-5 h-5 fill-current"></i>
                </div>
                <div>
                    <h1
                        class="text-base font-black uppercase tracking-tighter leading-none text-slate-700 dark:text-white">
                        ITech<span class="text-brand-600">Project</span>
                    </h1>
                    <span class="text-[7px] font-bold text-slate-400 tracking-[0.4em]">CONTROL DE PRECIOS PRO
                        V6.5</span>
                </div>
            </div>

            <!-- Controles de configuración y acciones -->
            <div class="flex flex-wrap items-center justify-center gap-4">
                <!-- Campos de configuración -->
                <div
                    class="flex items-center bg-slate-100 dark:bg-slate-950 p-1.5 rounded-lg border border-slate-200 dark:border-slate-800 shadow-inner px-5 font-bold">

                    <!-- Tasa Cambiaria -->
                    <div class="px-4 border-r dark:border-slate-800 text-center">
                        <label class="text-[7px] font-black uppercase text-slate-400 block mb-0.5 tracking-widest">Tasa
                            Cambiaria</label>
                        <input type="number" id="cfg-tasa" placeholder="--" onfocus="this.select()"
                            class="w-12 text-center dark:text-blue-400 font-bold">
                    </div>

                    <!-- Utilidad % -->
                    <div class="px-4 border-r dark:border-slate-800 text-center">
                        <label
                            class="text-[7px] font-black uppercase text-slate-400 block mb-0.5 tracking-widest">Utilidad
                            %</label>
                        <input type="number" id="cfg-util" placeholder="0" onfocus="this.select()"
                            class="w-10 text-center dark:text-blue-400 font-bold">
                    </div>

                    <!-- Efectivo % -->
                    <div class="px-4 border-r dark:border-slate-800 text-center">
                        <label
                            class="text-[7px] font-black uppercase text-slate-400 block mb-0.5 tracking-widest">Efectivo
                            %</label>
                        <input type="number" id="cfg-efec" placeholder="0" onfocus="this.select()"
                            class="w-10 text-center dark:text-blue-400 font-bold">
                    </div>

                    <!-- Botón Limpiar Configuración -->
                    <div class="px-4 text-center flex items-center justify-center">
                        <button onclick="limpiarConfig()"
                            class="text-slate-400 hover:text-brand-600 text-[8px] font-black uppercase tracking-widest transition-colors">
                            Limpiar
                        </button>
                    </div>
                </div>

                <!-- Botón Calcular (con icono de calculadora) -->
                <button onclick="calcularTodoTrigger()"
                    class="bg-brand-600 hover:bg-brand-700 text-white px-8 py-3 rounded-lg font-black text-[11px] uppercase tracking-widest flex items-center gap-2 shadow-lg transition-all active:scale-95">
                    <i data-lucide="calculator" class="w-4 h-4"></i>
                    Calcular
                </button>

                <!-- Botón de tema (modo oscuro/claro) -->
                <button onclick="toggleTheme()"
                    class="w-11 h-11 rounded-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 flex items-center justify-center shadow-sm hover:scale-110 text-slate-600 dark:text-brand-500">
                    <i id="theme-icon" data-lucide="moon"></i>
                </button>
            </div>
        </div>
    </nav>
</div>
