<!-- DASHBOARD (5 tarjetas solo con iconos pequeños) -->
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-6 text-center font-bold">
    <!-- Venta Liquidada -->
    <div
        class="card-wave wave-blue card-pro rounded-lg border-b-8 border-brand-500 shadow-sm flex flex-col justify-center">
        <div class="flex items-center justify-center gap-2 mb-1">
            <i data-lucide="dollar-sign" class="w-4 h-4 text-brand-600"></i>
            <p class="text-[10px] font-black text-brand-600 uppercase tracking-widest">Venta Liquidada</p>
        </div>
        <div id="dash-precio" class="text-2xl font-black text-brand-600 font-mono-finance tracking-tighter">$ 0.00</div>
    </div>

    <!-- Utilidad Bruta -->
    <div
        class="card-wave wave-indigo card-pro rounded-lg border-b-8 border-indigo-500 shadow-sm flex flex-col justify-center">
        <div class="flex items-center justify-center gap-2 mb-1">
            <i data-lucide="trending-up" class="w-4 h-4 text-indigo-600"></i>
            <p class="text-[10px] font-black text-indigo-600 uppercase tracking-widest">Utilidad Bruta</p>
        </div>
        <div id="dash-bruta" class="text-2xl font-black text-indigo-600 font-mono-finance tracking-tighter">$ 0.00</div>
    </div>

    <!-- Utilidad Neta -->
    <div
        class="card-wave wave-green card-pro rounded-lg border-b-8 border-emerald-500 shadow-sm flex flex-col justify-center">
        <div class="flex items-center justify-center gap-2 mb-1">
            <i data-lucide="target" class="w-4 h-4 text-emerald-600"></i>
            <p class="text-[10px] font-black text-emerald-500 uppercase tracking-widest">Utilidad Neta</p>
        </div>
        <div id="dash-ganancia" class="text-2xl font-black text-emerald-500 font-mono-finance tracking-tighter">$ 0.00
        </div>
    </div>

    <!-- Retenciones ONAT -->
    <div
        class="card-wave wave-orange card-pro rounded-lg border-b-8 border-amber-500 shadow-sm flex flex-col justify-center">
        <div class="flex items-center justify-center gap-2 mb-1">
            <i data-lucide="alert-octagon" class="w-4 h-4 text-amber-600"></i>
            <p class="text-[10px] font-black text-amber-500 uppercase tracking-widest">Retenciones ONAT</p>
        </div>
        <div id="dash-tax" class="text-2xl font-black text-amber-500 font-mono-finance tracking-tighter">$ 0.00</div>
    </div>

    <!-- Inversión Base Total -->
    <div
        class="dark-mesh-pro card-pro rounded-lg shadow-2xl flex flex-col justify-center border-b-8 border-blue-400 text-white">
        <div class="flex items-center justify-center gap-2 mb-1">
            <i data-lucide="database" class="w-4 h-4 text-blue-300"></i>
            <p class="text-[10px] font-black opacity-80 uppercase tracking-widest">Inversión Base Total</p>
        </div>
        <div id="dash-costo" class="text-2xl font-black font-mono-finance">$ 0.00</div>
    </div>
</div>
